[project]
name = "riskladder"
version = "0.1.0"
description = "Risk-bounded planning and learning for a rover on hazard maps, evaluated exactly: constrained MDPs, a safety shield, and model-free and model-based RL."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
]
demo = [
    "gradio>=5.0",  # the interactive demo, served at /demo when installed
]
exp = [
    "matplotlib>=3.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "hypothesis>=6.100",
    "pre-commit>=3.7",
    "matplotlib>=3.11.2",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.7",
    "pytest-cov>=7.1.0",
    "allpairspy>=2.5.1",
    "gradio>=5.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riskladder"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Local runs skip the `slow` experiment tests so the loop stays fast. CI and the nightly job run
# everything with `-m "slow or not slow"`.
addopts = "-q -m 'not slow'"
markers = ["slow: experiment and benchmark tests (several seconds each); run in CI and nightly"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]

[tool.coverage.run]
branch = true
source = ["riskladder"]

[tool.coverage.report]
# A gate, not evidence of quality: the mutation check (tools/mutation_check.py) measures that.
fail_under = 97
show_missing = true
