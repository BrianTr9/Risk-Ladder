[project]
name = "riskladder"
version = "0.1.0"
description = "Exact benchmarking of safe planning and learning for autonomous agents under model uncertainty."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
]

[project.optional-dependencies]
app = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "gradio>=5.0",
    "pydantic>=2.7",
]
exp = [
    "matplotlib>=3.9",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
    "hypothesis>=6.100",
    "pre-commit>=3.7",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/riskladder"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
